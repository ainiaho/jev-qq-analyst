name: Android APK (免签名构建)

# Fork 友好版构建：不需要任何发布签名 secrets。
# 产出 debug 签名 APK（AGP 自动生成的 debug keystore），可直接侧载安装。
on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'android/**'
      - 'shared/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  apk:
    name: 单测并构建 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/**/*.gradle*
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: 运行 JVM 单测并构建 debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: 整理产物
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$apk"
          mkdir -p release
          cp "$apk" "release/jev-qq-analyst-android-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: release/*.apk
          retention-days: 30
